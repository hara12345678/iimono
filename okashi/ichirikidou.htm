<h2>一力堂の桜餅</h2>
<p class="date">2012/4/08</p>
<p>松江城でお抹茶をいただきました。<br>350円でお得でした。</p>
<figure><img alt height="240" src="2012/ichiriki201204.JPG" width="320"></figure>
<p>お茶菓子は一力堂さんの桜餅です。<br>今日は実演販売もしていました。</p>
<p>薄い皮なんですが、桜の風味がよくしました。<br>なめらかなアンが甘さ控えめで美味しかったです。</p>
